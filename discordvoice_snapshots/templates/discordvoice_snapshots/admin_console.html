{% extends "allianceauth/base.html" %}
{% block title %}Snapshot Admin Console{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Snapshot Admin Console</h2>
    <hr>

    <p>Administrative tools for managing Discord voice snapshots.</p>

    <div class="list-group mt-3">
        <a href="{% url 'discordvoice_snapshots:list' %}" class="list-group-item list-group-item-action">
            View All Snapshots
        </a>
        <a href="{% url 'discordvoice_snapshots:audit_log' %}" class="list-group-item list-group-item-action">
            View Audit Log
        </a>
        <a href="{% url 'discordvoice_snapshots:cleanup_tools' %}" class="list-group-item list-group-item-action">
            Snapshot Cleanup Tools
        </a>
    </div>

    <a href="{% url 'allianceauth:dashboard' %}" class="btn btn-secondary mt-3">
        Back to Dashboard
    </a>
</div>
{% endblock %}
