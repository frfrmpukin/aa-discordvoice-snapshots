{% extends "allianceauth/base-bs5.html" %}
{% block title %}Snapshot Admin Console{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <h2 class="mb-4">Snapshot Admin Console</h2>

    <div class="card">
        <div class="card-body">
            <p class="text-body-secondary">Administrative tools for managing Discord voice snapshots.</p>
            <div class="list-group">
                <a href="{% url 'discordvoice_snapshots:list' %}" class="list-group-item list-group-item-action">
                    View All Snapshots
                </a>
                <a href="{% url 'discordvoice_snapshots:audit_log' %}" class="list-group-item list-group-item-action">
                    View Audit Log
                </a>
                <a href="{% url 'discordvoice_snapshots:cleanup_tools' %}" class="list-group-item list-group-item-action">
                    Snapshot Cleanup Tools
                </a>
            </div>
        </div>
    </div>

    <a href="{% url 'allianceauth:dashboard' %}" class="btn btn-outline-secondary mt-3">
        Back to Dashboard
    </a>
</div>
{% endblock %}
