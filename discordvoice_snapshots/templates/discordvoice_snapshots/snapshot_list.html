{% extends "base.html" %}
{% block content %}
<h2>Snapshots</h2>
<a href="{% url 'discordvoice_snapshots:take_snapshot' %}" class="btn btn-primary mb-3">Take Snapshot</a>

<table class="table">
  <thead><tr><th>Channel</th><th>Timestamp</th><th>Tag</th><th></th></tr></thead>
  <tbody>
    {% for s in snapshots %}
      <tr>
        <td>{{ s.channel_name }}</td>
        <td>{{ s.timestamp }}</td>
        <td>{{ s.tag.name|default:"None" }}</td>
        <td><a href="{% url 'discordvoice_snapshots:detail' s.id %}">View</a></td>
      </tr>
    {% empty %}
      <tr><td colspan="4">No snapshots</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
