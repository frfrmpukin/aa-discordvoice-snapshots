{% extends "base.html" %}
{% block content %}
<h2>Take Snapshot</h2>
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Tag</label>
    <select name="tag" class="form-select">
      <option value="">No Tag</option>
      {% for tag in tags %}
        <option value="{{ tag.id }}">{{ tag.name }}</option>
      {% endfor %}
    </select>
  </div>
  <button class="btn btn-primary">Take Snapshot</button>
  <a href="{% url 'discordvoice_snapshots:list' %}" class="btn btn-secondary">Back</a>
</form>
{% endblock %}
