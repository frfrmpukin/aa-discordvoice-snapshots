[metadata]
name = aa-discord-voicesnapshot
version = 1.0.0
description = Alliance Auth module for recording and managing Discord voice channel snapshots.
long_description = file: README.md
long_description_content_type = text/markdown
author = frfrmpukin
license = MIT
url = https://github.com/frfrmpukin/aa-discord-voicesnapshot

[options]
packages = find:
include_package_data = True
python_requires = >=3.8
install_requires =
    allianceauth>=3.0.0
    django>=3.2

[options.package_data]
* = *.html, *.css, *.js, *.png, *.jpg, *.jpeg, *.gif

[options.extras_require]
dev =
    wheel
    twine
    setuptools
