[metadata]
name = aa-discordvoice-snapshots
version = 1.0.13
description = Alliance Auth module for recording and managing Discord voice channel snapshots.
long_description = file: README.md
long_description_content_type = text/markdown
author = frfrmpukin
license = MIT
url = https://github.com/frfrmpukin/aa-discordvoice-snapshots

[options]
packages = find:
include_package_data = True
python_requires = >=3.10
install_requires =
    allianceauth>=5.3,<6
    django>=5.2,<6
    django-sri>=0.8,<1
    allianceauth-discordbot @ git+https://github.com/Solar-Helix-Independent-Transport/allianceauth-discordbot.git

[options.packages.find]
include =
    discordvoice_snapshots*

[options.package_data]
* = *.html, *.css, *.js, *.png, *.jpg, *.jpeg, *.gif

[options.extras_require]
dev =
    wheel
    twine
    setuptools
